name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency: release

permissions:
  contents: write # semantic-release creates tags + GitHub releases

env:
  IMAGE: ricardozambon/colecionary

jobs:
  # 1) Gate: everything must build and test before we consider a release.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Backend build (warnings are errors)
        run: dotnet build backend/Vault.slnx -c Release
      - name: Backend unit tests
        run: dotnet test backend/tests/Vault.UnitTests -c Release --no-build

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install
        run: npm ci
        working-directory: frontend
      - name: Frontend tests
        run: npm test
        working-directory: frontend
      - name: Frontend production build
        run: npm run build
        working-directory: frontend

  # 2) Compute the next version from conventional commits (no tag yet).
  #    Never on pull_request — releasing only happens on push to main.
  version:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 3) Build + push the single image to Docker Hub, stamped with the version.
  publish:
    needs: version
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -e
          sed -i -E "s#<Version>[^<]*</Version>#<Version>${VERSION}</Version>#" backend/src/Vault.Api/Vault.Api.csproj
          npm version "${VERSION}" --no-git-tag-version --allow-same-version --prefix frontend
          grep -q "<Version>${VERSION}</Version>" backend/src/Vault.Api/Vault.Api.csproj
          grep -q "\"version\": \"${VERSION}\"" frontend/package.json

      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 4) Tag + GitHub release only after the image exists (tag never outruns artifact).
  release:
    needs: [version, publish]
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
