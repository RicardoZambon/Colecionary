<a class="brand" routerLink="/dashboard">
  <span class="brand__mark"><ui-icon name="diamond" [size]="12" /></span>Vault
</a>

<span class="crumb">{{ crumb() }}</span>

<span class="spacer"></span>

<ui-text-input
  class="search"
  variant="subtle"
  [placeholder]="'topbar.search' | t"
  [value]="store.query()"
  (valueChange)="store.query.set($event)"
/>

<ui-dropdown #langMenu [width]="180">
  <button ddTrigger type="button" class="theme-trigger" [title]="'topbar.language' | t">
    <ui-flag [lang]="i18n.currentDef.id" [size]="16" />
    {{ i18n.currentDef.id }} ▾
  </button>
  <ng-container ddPanel>
    @for (lang of i18n.langs; track lang.id) {
      <button
        type="button"
        class="theme-row"
        [attr.aria-current]="lang.id === i18n.current() ? 'true' : null"
        [class.active]="lang.id === i18n.current()"
        (click)="i18n.apply(lang.id); langMenu.close()"
      >
        <ui-flag [lang]="lang.id" [size]="20" />
        <span class="theme-row__name">{{ lang.name }}</span>
        <span class="theme-row__check" aria-hidden="true">@if (lang.id === i18n.current()) { ✓ }</span>
      </button>
    }
  </ng-container>
</ui-dropdown>

<ui-dropdown #themeMenu [width]="236">
  <button ddTrigger type="button" class="theme-trigger" [title]="'topbar.theme' | t">
    ◐ {{ theme.currentDef.name }} ▾
  </button>
  <ng-container ddPanel>
    @for (t of theme.themes; track t.id) {
      <button
        type="button"
        class="theme-row"
        [attr.aria-current]="t.id === theme.current() ? 'true' : null"
        [class.active]="t.id === theme.current()"
        (click)="theme.apply(t.id); themeMenu.close()"
      >
        <span class="theme-row__swatches">
          <span [style.background]="t.swatches[0]"></span>
          <span [style.background]="t.swatches[2]"></span>
          <span [style.background]="t.swatches[4]"></span>
        </span>
        <span class="theme-row__name">{{ t.name }}</span>
        <span class="theme-row__check" aria-hidden="true">@if (t.id === theme.current()) { ✓ }</span>
      </button>
    }
    <a class="theme-more" routerLink="/settings" [queryParams]="{ tab: 'appearance' }" (click)="themeMenu.close()">
      {{ 'topbar.themeMore' | t }}
    </a>
  </ng-container>
</ui-dropdown>

<a class="gear" routerLink="/settings" [title]="'topbar.settings' | t" [attr.aria-label]="'topbar.settings' | t">
  <ui-icon name="gear" [size]="16" />
</a>

<ui-dropdown #profileMenu [width]="200">
  <button ddTrigger type="button" class="avatar-trigger" [title]="'topbar.account' | t">
    <ui-avatar [initials]="store.profile()?.initials ?? '··'" />
  </button>
  <ng-container ddPanel>
    <div class="profile-info">
      <span class="profile-info__name">{{ store.profile()?.name }}</span>
      <span class="profile-info__email">{{ store.profile()?.email }}</span>
    </div>
    <button type="button" class="signout" (click)="profileMenu.close(); auth.logout()">{{ 'topbar.signOut' | t }}</button>
  </ng-container>
</ui-dropdown>
