<!--
  The nav drawer's toggle. Below $bp-lg the sidebar is off-canvas, so this is
  the only way to reach it; above, it is hidden and the sidebar is a column.
-->
<ui-button
  class="hamburger"
  variant="icon"
  [ariaLabel]="'nav.open' | t"
  [controlId]="toggleId"
  [ariaExpanded]="layout.navOpen()"
  [ariaControls]="drawerId"
  (click)="layout.toggleNav()"
><ui-icon name="list" [size]="16" /></ui-button>

<a class="brand" routerLink="/dashboard">
  <span class="brand__mark"><ui-icon name="diamond" [size]="12" /></span>Vault
</a>

<span class="crumb">{{ crumb() }}</span>

<!--
  The sidebar's status line is inside a closed drawer below $bp-lg, so the two
  states that matter — the app is not connected, or a save was refused — would
  otherwise not be on screen at all: the user had to open the menu to find out
  the app was offline. Rendered where the crumb is hidden at that width, so it
  costs no room.
-->
@if (store.syncNeedsAttention()) {
  <span class="sync" [attr.data-sync]="store.syncState()" role="status">
    <ui-icon [name]="store.syncIcon()" [size]="11" [strokeWidth]="2.4" />
    <span>{{ store.syncStatusKey() | t }}</span>
  </span>
}

<span class="spacer"></span>

<!--
  Only where there are results to show. It was rendered on every authenticated
  route and read by exactly two — the collection page and the item page — so on
  the dashboard, the store and settings a user typed what they were looking for
  into the most inviting control on the screen and nothing whatever happened.
  The text also survived the navigation, so it was still filtering a list the
  next time they opened a collection.
-->
@if (inCollection()) {
  <ui-text-input
    class="search"
    variant="subtle"
    name="q"
    [ariaLabel]="'topbar.search' | t"
    [placeholder]="'topbar.search' | t"
    [value]="store.query()"
    (valueChange)="store.query.set($event)"
  />
}

<app-lang-picker class="lang" />

<ui-dropdown #themeMenu class="theme" [width]="236">
  <button
    ddTrigger
    type="button"
    class="theme-trigger"
    [title]="'topbar.theme' | t"
    [attr.aria-haspopup]="true"
    [attr.aria-expanded]="themeMenu.open()"
    [attr.aria-controls]="themeMenu.panelId"
  >
    <ui-icon name="contrast" [size]="13" />
    <span>{{ theme.currentDef.name }}</span>
    <ui-icon class="caret" name="chevron-down" [size]="11" />
  </button>
  <ng-container ddPanel>
    @for (t of theme.themes; track t.id) {
      <button
        type="button"
        class="theme-row"
        [attr.aria-current]="t.id === theme.current() ? 'true' : null"
        [class.active]="t.id === theme.current()"
        (click)="theme.apply(t.id); themeMenu.close()"
      >
        <span class="theme-row__swatches">
          <span [style.background]="t.swatches[0]"></span>
          <span [style.background]="t.swatches[2]"></span>
          <span [style.background]="t.swatches[4]"></span>
        </span>
        <span class="theme-row__name">{{ t.name }}</span>
        <span class="theme-row__check">
          @if (t.id === theme.current()) {
            <ui-icon name="check" [size]="13" />
          }
        </span>
      </button>
    }
    <a class="theme-more" routerLink="/settings" [queryParams]="{ tab: 'appearance' }" (click)="themeMenu.close()">
      {{ 'topbar.themeMore' | t }}
    </a>
  </ng-container>
</ui-dropdown>

<a class="gear" routerLink="/settings" [title]="'topbar.settings' | t" [attr.aria-label]="'topbar.settings' | t">
  <ui-icon name="gear" [size]="16" />
</a>

<ui-dropdown #profileMenu [width]="200">
  <button
    ddTrigger
    type="button"
    class="avatar-trigger"
    [title]="'topbar.account' | t"
    [attr.aria-haspopup]="true"
    [attr.aria-expanded]="profileMenu.open()"
    [attr.aria-controls]="profileMenu.panelId"
  >
    <ui-avatar [initials]="store.profile()?.initials ?? '··'" />
  </button>
  <ng-container ddPanel>
    <div class="profile-info">
      <span class="profile-info__name">{{ store.profile()?.name }}</span>
      <span class="profile-info__email">{{ store.profile()?.email }}</span>
    </div>
    <button type="button" class="signout" (click)="profileMenu.close(); auth.logout()">{{ 'topbar.signOut' | t }}</button>
  </ng-container>
</ui-dropdown>
