<div class="sec" [class.sec--active]="active()">
  <button
    type="button"
    class="sec__toggle"
    [attr.aria-pressed]="active()"
    [attr.title]="(active() ? 'section.showAll' : 'section.only') | t: { name: name() }"
    (click)="toggle.emit()"
  >
    <ui-section-label>{{ name() }}</ui-section-label>
  </button>

  @if (stats(); as s) {
    <span class="sec__ratio">{{ ratio() }}</span>
    @if (s.hasTarget) {
      <ui-progress
        class="sec__bar"
        size="sm"
        [pct]="s.pct"
        [secondaryPct]="s.cataloguedPct"
        [label]="'progress.label' | t: { name: name() }"
        [valueText]="progressText()"
      />
    }
    @if (s.catalogued === 0) {
      <ui-empty
        class="sec__empty"
        [compact]="true"
        icon="tag"
        [title]="'section.empty' | t"
      />
    }
  }
</div>
