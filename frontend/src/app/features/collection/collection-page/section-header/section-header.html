<div class="sec" [class.sec--active]="active()">
  <!--
    The heading wraps the control, rather than the control being given a heading
    level of its own. A divider's name *is* a heading — it titles the run of
    items under it — but this one is also the filter that narrows the list to
    that run, and a heading is not a control. Wrapping is the pattern that gets
    both: the outline gains an entry, and the thing that takes focus is still a
    button that announces its pressed state.

    So `ui-section-label` deliberately does NOT take `level` here. The h3 is
    outside it, and the label keeps being only paint.
  -->
  <h3 class="sec__heading">
    <button
      type="button"
      class="sec__toggle"
      [attr.aria-pressed]="active()"
      [attr.title]="(active() ? 'section.showAll' : 'section.only') | t: { name: name() }"
      (click)="toggle.emit()"
    >
      <ui-section-label>{{ name() }}</ui-section-label>
    </button>
  </h3>

  @if (stats(); as s) {
    <span class="sec__ratio">{{ ratio() }}</span>
    @if (s.hasTarget) {
      <ui-progress
        class="sec__bar"
        size="sm"
        [pct]="s.pct"
        [secondaryPct]="s.cataloguedPct"
        [label]="'progress.label' | t: { name: name() }"
        [valueText]="progressText()"
      />
    }
    @if (s.catalogued === 0) {
      <ui-empty
        class="sec__empty"
        [compact]="true"
        icon="tag"
        [title]="'section.empty' | t"
      />
    }
  }
</div>
