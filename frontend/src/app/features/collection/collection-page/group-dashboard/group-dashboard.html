<div class="board">
  @for (card of cards(); track card.id) {
    <app-group-card
      [collectionId]="collectionId()"
      [groupId]="card.id"
      [name]="card.name"
      [stats]="card.stats"
      [tiles]="card.tiles"
    />
  }

  @if (directCount()) {
    <a
      class="tile"
      [routerLink]="['/c', collectionId()]"
      [queryParams]="{ v: 'grid' }"
      queryParamsHandling="merge"
    >
      <ui-icon class="tile__glyph" name="grid" [size]="22" [strokeWidth]="1.6" />
      {{ filedHere() }}
    </a>
  }

  @if (canEdit()) {
    <button type="button" class="tile tile--new" (click)="newGroup.emit()">{{ 'groupDashboard.newGroup' | t }}</button>
  }
</div>

@if (!cards().length && !directCount()) {
  <!-- One shape for every "nothing here" in the app. A hand-rolled div drifts:
       this one and the collection page's were byte-identical CSS in two files. -->
  <ui-empty icon="grid" [title]="'groupDashboard.emptyTitle' | t" [body]="'groupDashboard.empty' | t" />
}
