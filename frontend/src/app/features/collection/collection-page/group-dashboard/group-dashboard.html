<div class="board">
  @for (card of cards(); track card.id) {
    <app-group-card
      [collectionId]="collectionId()"
      [groupId]="card.id"
      [name]="card.name"
      [stats]="card.stats"
      [tiles]="card.tiles"
    />
  }

  @if (directCount()) {
    <a
      class="tile"
      [routerLink]="['/c', collectionId()]"
      [queryParams]="{ v: 'grid' }"
      queryParamsHandling="merge"
    >
      <span class="tile__glyph" aria-hidden="true">▦</span>
      {{ filedHere() }}
    </a>
  }

  <button type="button" class="tile tile--new" (click)="newGroup.emit()">{{ 'groupDashboard.newGroup' | t }}</button>
</div>

@if (!cards().length && !directCount()) {
  <div class="empty">{{ 'groupDashboard.empty' | t }}</div>
}
