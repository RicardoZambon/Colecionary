<ui-card class="panel">
  <div class="brand">
    <span class="brand__mark"><ui-icon name="diamond" [size]="15" /></span>
    <span class="brand__name">Vault</span>
  </div>
  <p class="tagline">{{ 'login.tagline' | t }}</p>

  <!--
    `ui-field` renders a <label> with no `for` and the control is its sibling,
    so the visible label names nothing; a placeholder is not an accessible name
    either, and the password field's is a row of dots. So the name goes on the
    control itself through `ariaLabel` — the same arrangement the topbar search
    and the item form document, and the reason that input exists.
  -->
  <form (submit)="$event.preventDefault(); submit()">
    <ui-field [label]="'login.email' | t">
      <ui-text-input
        type="email"
        [ariaLabel]="'login.email' | t"
        [placeholder]="'login.emailPlaceholder' | t"
        [value]="email()"
        (valueChange)="email.set($event)"
      />
    </ui-field>
    <ui-field [label]="'login.password' | t">
      <ui-text-input
        type="password"
        [ariaLabel]="'login.password' | t"
        placeholder="••••••••"
        [value]="password()"
        (valueChange)="password.set($event)"
      />
    </ui-field>

    @if (error(); as message) {
      <div class="error" role="alert">{{ message }}</div>
    }

    <ui-button type="submit" [block]="true" [disabled]="busy()">
      {{ (busy() ? 'login.submitting' : 'login.submit') | t }}
    </ui-button>
  </form>

  <div class="demo-hint">
    {{ 'login.demoHint' | t }} <span class="mono">marcus@example.com</span> · <span class="mono">vault-demo</span>
  </div>
</ui-card>
