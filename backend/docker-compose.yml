services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vault-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Pass123"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - vault-sqldata:/var/opt/mssql
    healthcheck:
      # sqlcmd ships under mssql-tools18 in the 2022 image; -C trusts the dev cert.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  vault-sqldata:
