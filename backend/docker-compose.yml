services:
  postgres:
    image: postgres:17
    container_name: vault-postgres
    environment:
      POSTGRES_DB: vault
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: vault
    ports:
      # 5433 on the host — 5432 is commonly taken by other local Postgres instances.
      - "5433:5432"
    volumes:
      - vault-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault -d vault"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vault-pgdata:
